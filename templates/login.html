{% extends "base.html" %}
{% block title %}Login | Mini Drive{% endblock %}

{% block content %}

<!-- Background image overlay -->
<div class="login-bg"></div>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your Mini Drive</p>

    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" onclick="startLoading(this)">
    <span>Login</span>
</button>
    </form>

    <p class="link-text">
        New user?
        <a href="{{ url_for('register') }}">Create account</a>
    </p>
</div>

{% endblock %}
